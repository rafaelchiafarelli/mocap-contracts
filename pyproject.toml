[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mocap-contracts"
version = "0.0.1"
description = "Data contracts shared by the Mocap Studio repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["mocap_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

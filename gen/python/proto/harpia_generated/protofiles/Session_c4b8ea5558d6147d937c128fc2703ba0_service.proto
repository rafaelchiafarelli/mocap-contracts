syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/Session_c4b8ea5558d6147d937c128fc2703ba0.proto";

message Session_Message {
    Session msg = 1;
}
//message for the standard functions 
message Session_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message Session_ID {
    int32 id = 1;
}
message Session_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service Session_Service {
    rpc heartBeat(Session_HeartBeat) returns (Session_HeartBeat) {}
    rpc streamSrc(Session_Stream ) returns (stream Session_Message) {}
    rpc pullByID(Session_ID) returns (Session_Message) {}
    rpc push(Session_Message) returns (errorCode) {}
}

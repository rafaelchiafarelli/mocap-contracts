syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/BibleCatalog_e51d6d03132b4baa0ced72cde01af9d0.proto";

message BibleCatalog_Message {
    BibleCatalog msg = 1;
}
//message for the standard functions 
message BibleCatalog_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message BibleCatalog_ID {
    int32 id = 1;
}
message BibleCatalog_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service BibleCatalog_Service {
    rpc heartBeat(BibleCatalog_HeartBeat) returns (BibleCatalog_HeartBeat) {}
    rpc streamSrc(BibleCatalog_Stream ) returns (stream BibleCatalog_Message) {}
    rpc pullByID(BibleCatalog_ID) returns (BibleCatalog_Message) {}
    rpc push(BibleCatalog_Message) returns (errorCode) {}
}

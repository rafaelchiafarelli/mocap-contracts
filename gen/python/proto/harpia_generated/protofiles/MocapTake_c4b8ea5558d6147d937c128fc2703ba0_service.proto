syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/MocapTake_c4b8ea5558d6147d937c128fc2703ba0.proto";

message MocapTake_Message {
    MocapTake msg = 1;
}
//message for the standard functions 
message MocapTake_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message MocapTake_ID {
    int32 id = 1;
}
message MocapTake_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service MocapTake_Service {
    rpc heartBeat(MocapTake_HeartBeat) returns (MocapTake_HeartBeat) {}
    rpc streamSrc(MocapTake_Stream ) returns (stream MocapTake_Message) {}
    rpc pullByID(MocapTake_ID) returns (MocapTake_Message) {}
    rpc push(MocapTake_Message) returns (errorCode) {}
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/SceneIndex_e51d6d03132b4baa0ced72cde01af9d0.proto";

message SceneIndex_Message {
    SceneIndex msg = 1;
}
//message for the standard functions 
message SceneIndex_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message SceneIndex_ID {
    int32 id = 1;
}
message SceneIndex_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service SceneIndex_Service {
    rpc heartBeat(SceneIndex_HeartBeat) returns (SceneIndex_HeartBeat) {}
    rpc streamSrc(SceneIndex_Stream ) returns (stream SceneIndex_Message) {}
    rpc pullByID(SceneIndex_ID) returns (SceneIndex_Message) {}
    rpc push(SceneIndex_Message) returns (errorCode) {}
}

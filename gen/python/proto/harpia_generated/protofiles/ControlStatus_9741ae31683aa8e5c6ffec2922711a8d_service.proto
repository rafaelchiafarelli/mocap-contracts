syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/ControlStatus_9741ae31683aa8e5c6ffec2922711a8d.proto";

message ControlStatus_Message {
    ControlStatus msg = 1;
}
//message for the standard functions 
message ControlStatus_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ControlStatus_ID {
    int32 id = 1;
}
message ControlStatus_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ControlStatus_Service {
    rpc heartBeat(ControlStatus_HeartBeat) returns (ControlStatus_HeartBeat) {}
    rpc streamSrc(ControlStatus_Stream ) returns (stream ControlStatus_Message) {}
    rpc pullByID(ControlStatus_ID) returns (ControlStatus_Message) {}
    rpc push(ControlStatus_Message) returns (errorCode) {}
}

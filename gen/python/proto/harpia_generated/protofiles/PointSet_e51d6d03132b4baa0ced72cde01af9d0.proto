syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message PointSet {
int32 ID_e51d6d03132b4baa0ced72cde01af9d0 = 1;
string name = 2;
string role = 3;
string path = 4;
int64 frames = 5;
repeated string point_names = 6;
string STATUS_e51d6d03132b4baa0ced72cde01af9d0 = 7;
string ERROR_e51d6d03132b4baa0ced72cde01af9d0 = 8;
string ORIGINATOR = 9;
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/TitlePages_186a1974c92f444f1bbc853569958a27.proto";

message TitlePages_Message {
    TitlePages msg = 1;
}
//message for the standard functions 
message TitlePages_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message TitlePages_ID {
    int32 id = 1;
}
message TitlePages_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service TitlePages_Service {
    rpc heartBeat(TitlePages_HeartBeat) returns (TitlePages_HeartBeat) {}
    rpc streamSrc(TitlePages_Stream ) returns (stream TitlePages_Message) {}
    rpc pullByID(TitlePages_ID) returns (TitlePages_Message) {}
    rpc push(TitlePages_Message) returns (errorCode) {}
}

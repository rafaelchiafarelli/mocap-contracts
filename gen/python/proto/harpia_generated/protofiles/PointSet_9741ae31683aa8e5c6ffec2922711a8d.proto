syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message PointSet {
int32 ID_9741ae31683aa8e5c6ffec2922711a8d = 1;
string name = 2;
string role = 3;
string path = 4;
int64 frames = 5;
repeated string point_names = 6;
string STATUS_9741ae31683aa8e5c6ffec2922711a8d = 7;
string ERROR_9741ae31683aa8e5c6ffec2922711a8d = 8;
string ORIGINATOR = 9;
}

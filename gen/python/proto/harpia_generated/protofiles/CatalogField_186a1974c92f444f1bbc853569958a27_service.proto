syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/CatalogField_186a1974c92f444f1bbc853569958a27.proto";

message CatalogField_Message {
    CatalogField msg = 1;
}
//message for the standard functions 
message CatalogField_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CatalogField_ID {
    int32 id = 1;
}
message CatalogField_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CatalogField_Service {
    rpc heartBeat(CatalogField_HeartBeat) returns (CatalogField_HeartBeat) {}
    rpc streamSrc(CatalogField_Stream ) returns (stream CatalogField_Message) {}
    rpc pullByID(CatalogField_ID) returns (CatalogField_Message) {}
    rpc push(CatalogField_Message) returns (errorCode) {}
}

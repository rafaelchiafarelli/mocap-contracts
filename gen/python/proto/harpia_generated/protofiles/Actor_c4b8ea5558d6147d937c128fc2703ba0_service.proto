syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/Actor_c4b8ea5558d6147d937c128fc2703ba0.proto";

message Actor_Message {
    Actor msg = 1;
}
//message for the standard functions 
message Actor_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message Actor_ID {
    int32 id = 1;
}
message Actor_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service Actor_Service {
    rpc heartBeat(Actor_HeartBeat) returns (Actor_HeartBeat) {}
    rpc streamSrc(Actor_Stream ) returns (stream Actor_Message) {}
    rpc pullByID(Actor_ID) returns (Actor_Message) {}
    rpc push(Actor_Message) returns (errorCode) {}
}

syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "harpia_generated/protofiles/Actor_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "harpia_generated/protofiles/Character_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "harpia_generated/protofiles/Casting_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message Session {
int32 HARPIA_ID = 1;
string id = 2;
string date = 3;
repeated Actor actors = 4;
repeated Character characters = 5;
repeated Casting casting = 6;
string HARPIA_STATUS = 7;
string HARPIA_ERROR = 8;
string HARPIA_ORIGINATOR = 9;
}

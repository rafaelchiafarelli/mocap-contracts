syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/CameraQuality_9741ae31683aa8e5c6ffec2922711a8d.proto";

message CameraQuality_Message {
    CameraQuality msg = 1;
}
//message for the standard functions 
message CameraQuality_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CameraQuality_ID {
    int32 id = 1;
}
message CameraQuality_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CameraQuality_Service {
    rpc heartBeat(CameraQuality_HeartBeat) returns (CameraQuality_HeartBeat) {}
    rpc streamSrc(CameraQuality_Stream ) returns (stream CameraQuality_Message) {}
    rpc pullByID(CameraQuality_ID) returns (CameraQuality_Message) {}
    rpc push(CameraQuality_Message) returns (errorCode) {}
}

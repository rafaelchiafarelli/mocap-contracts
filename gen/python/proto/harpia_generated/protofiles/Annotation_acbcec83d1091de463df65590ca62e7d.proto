syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "harpia_generated/protofiles/AnnotationKind_acbcec83d1091de463df65590ca62e7d.proto";
import "harpia_generated/protofiles/AnnotationAnchor_acbcec83d1091de463df65590ca62e7d.proto";
import "harpia_generated/protofiles/BibleValue_acbcec83d1091de463df65590ca62e7d.proto";
message Annotation {
int32 ID_acbcec83d1091de463df65590ca62e7d = 1;

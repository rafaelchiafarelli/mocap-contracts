syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/LengthUnit_61c8c10158ef4d464aeae2ffe73974e6.proto";

message LengthUnit_Message {
    LengthUnit msg = 1;
}
//message for the standard functions 
message LengthUnit_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message LengthUnit_ID {
    int32 id = 1;
}
message LengthUnit_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service LengthUnit_Service {
    rpc heartBeat(LengthUnit_HeartBeat) returns (LengthUnit_HeartBeat) {}
    rpc streamSrc(LengthUnit_Stream ) returns (stream LengthUnit_Message) {}
    rpc pullByID(LengthUnit_ID) returns (LengthUnit_Message) {}
    rpc push(LengthUnit_Message) returns (errorCode) {}
}

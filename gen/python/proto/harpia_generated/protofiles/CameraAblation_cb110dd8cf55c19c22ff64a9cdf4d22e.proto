syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message CameraAblation {
int32 HARPIA_ID = 1;
string removed_role = 2;
float mean_shift_m = 3;
float mean_rsd_change = 4;
string HARPIA_STATUS = 5;
string HARPIA_ERROR = 6;
string HARPIA_ORIGINATOR = 7;
}

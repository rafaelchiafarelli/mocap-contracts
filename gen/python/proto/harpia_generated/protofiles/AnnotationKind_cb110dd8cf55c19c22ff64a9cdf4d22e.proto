syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

enum AnnotationKind {
ANNOTATION_KIND_UNSET = 0;
ANNOTATION_KIND_NOTE = 1;
ANNOTATION_KIND_CHARACTER_DIRECTION = 2;
ANNOTATION_KIND_PROP_DIRECTION = 3;
ANNOTATION_KIND_SPECIAL_EFFECT = 4;
ANNOTATION_KIND_SET_DIRECTION = 5;
ANNOTATION_KIND_SOUND_DIRECTION = 6;
ANNOTATION_KIND_GENERAL_DIRECTION = 7;
ANNOTATION_KIND_TRANSITION = 8;
ANNOTATION_KIND_SHOT = 9;
}

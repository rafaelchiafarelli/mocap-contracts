syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/FilmOrigin_136996d09eedbf0a12cec4204d8d4ec2.proto";

message FilmOrigin_Message {
    FilmOrigin msg = 1;
}
//message for the standard functions 
message FilmOrigin_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message FilmOrigin_ID {
    int32 id = 1;
}
message FilmOrigin_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service FilmOrigin_Service {
    rpc heartBeat(FilmOrigin_HeartBeat) returns (FilmOrigin_HeartBeat) {}
    rpc streamSrc(FilmOrigin_Stream ) returns (stream FilmOrigin_Message) {}
    rpc pullByID(FilmOrigin_ID) returns (FilmOrigin_Message) {}
    rpc push(FilmOrigin_Message) returns (errorCode) {}
}

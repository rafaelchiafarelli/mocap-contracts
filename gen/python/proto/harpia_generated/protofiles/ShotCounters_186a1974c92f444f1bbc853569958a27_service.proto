syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/ShotCounters_186a1974c92f444f1bbc853569958a27.proto";

message ShotCounters_Message {
    ShotCounters msg = 1;
}
//message for the standard functions 
message ShotCounters_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ShotCounters_ID {
    int32 id = 1;
}
message ShotCounters_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ShotCounters_Service {
    rpc heartBeat(ShotCounters_HeartBeat) returns (ShotCounters_HeartBeat) {}
    rpc streamSrc(ShotCounters_Stream ) returns (stream ShotCounters_Message) {}
    rpc pullByID(ShotCounters_ID) returns (ShotCounters_Message) {}
    rpc push(ShotCounters_Message) returns (errorCode) {}
}

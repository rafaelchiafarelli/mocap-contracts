syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/Take_c4b8ea5558d6147d937c128fc2703ba0.proto";

message Take_Message {
    Take msg = 1;
}
//message for the standard functions 
message Take_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message Take_ID {
    int32 id = 1;
}
message Take_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service Take_Service {
    rpc heartBeat(Take_HeartBeat) returns (Take_HeartBeat) {}
    rpc streamSrc(Take_Stream ) returns (stream Take_Message) {}
    rpc pullByID(Take_ID) returns (Take_Message) {}
    rpc push(Take_Message) returns (errorCode) {}
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/CameraControls_17f8b54225d6d535e6d691175cc18809.proto";

message CameraControls_Message {
    CameraControls msg = 1;
}
//message for the standard functions 
message CameraControls_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CameraControls_ID {
    int32 id = 1;
}
message CameraControls_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CameraControls_Service {
    rpc heartBeat(CameraControls_HeartBeat) returns (CameraControls_HeartBeat) {}
    rpc streamSrc(CameraControls_Stream ) returns (stream CameraControls_Message) {}
    rpc pullByID(CameraControls_ID) returns (CameraControls_Message) {}
    rpc push(CameraControls_Message) returns (errorCode) {}
}

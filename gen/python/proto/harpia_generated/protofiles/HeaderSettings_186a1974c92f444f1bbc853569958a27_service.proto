syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/HeaderSettings_186a1974c92f444f1bbc853569958a27.proto";

message HeaderSettings_Message {
    HeaderSettings msg = 1;
}
//message for the standard functions 
message HeaderSettings_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message HeaderSettings_ID {
    int32 id = 1;
}
message HeaderSettings_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service HeaderSettings_Service {
    rpc heartBeat(HeaderSettings_HeartBeat) returns (HeaderSettings_HeartBeat) {}
    rpc streamSrc(HeaderSettings_Stream ) returns (stream HeaderSettings_Message) {}
    rpc pullByID(HeaderSettings_ID) returns (HeaderSettings_Message) {}
    rpc push(HeaderSettings_Message) returns (errorCode) {}
}

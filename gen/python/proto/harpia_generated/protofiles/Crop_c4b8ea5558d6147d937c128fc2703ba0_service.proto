syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/Crop_c4b8ea5558d6147d937c128fc2703ba0.proto";

message Crop_Message {
    Crop msg = 1;
}
//message for the standard functions 
message Crop_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message Crop_ID {
    int32 id = 1;
}
message Crop_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service Crop_Service {
    rpc heartBeat(Crop_HeartBeat) returns (Crop_HeartBeat) {}
    rpc streamSrc(Crop_Stream ) returns (stream Crop_Message) {}
    rpc pullByID(Crop_ID) returns (Crop_Message) {}
    rpc push(Crop_Message) returns (errorCode) {}
}

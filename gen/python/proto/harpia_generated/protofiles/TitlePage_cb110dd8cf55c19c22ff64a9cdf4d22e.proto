syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message TitlePage {
int32 ID_cb110dd8cf55c19c22ff64a9cdf4d22e = 1;
string title = 2;
string subtitle = 3;
string episode = 4;
string author = 5;
repeated string co_authors = 6;
string email = 7;
string STATUS_cb110dd8cf55c19c22ff64a9cdf4d22e = 8;
string ERROR_cb110dd8cf55c19c22ff64a9cdf4d22e = 9;
string ORIGINATOR = 10;
}

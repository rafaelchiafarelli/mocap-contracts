syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/contracts_placeholder_fb15c485dc8666ed616f54252a0db38b.proto";

message contracts_placeholder_Message {
    contracts_placeholder msg = 1;
}
//message for the standard functions 
message contracts_placeholder_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message contracts_placeholder_ID {
    int32 id = 1;
}
message contracts_placeholder_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service contracts_placeholder_Service {
    rpc heartBeat(contracts_placeholder_HeartBeat) returns (contracts_placeholder_HeartBeat) {}
    rpc streamSrc(contracts_placeholder_Stream ) returns (stream contracts_placeholder_Message) {}
    rpc pullByID(contracts_placeholder_ID) returns (contracts_placeholder_Message) {}
    rpc push(contracts_placeholder_Message) returns (errorCode) {}
}

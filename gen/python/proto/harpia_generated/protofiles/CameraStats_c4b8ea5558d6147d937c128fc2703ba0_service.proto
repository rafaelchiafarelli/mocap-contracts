syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/CameraStats_c4b8ea5558d6147d937c128fc2703ba0.proto";

message CameraStats_Message {
    CameraStats msg = 1;
}
//message for the standard functions 
message CameraStats_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CameraStats_ID {
    int32 id = 1;
}
message CameraStats_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CameraStats_Service {
    rpc heartBeat(CameraStats_HeartBeat) returns (CameraStats_HeartBeat) {}
    rpc streamSrc(CameraStats_Stream ) returns (stream CameraStats_Message) {}
    rpc pullByID(CameraStats_ID) returns (CameraStats_Message) {}
    rpc push(CameraStats_Message) returns (errorCode) {}
}

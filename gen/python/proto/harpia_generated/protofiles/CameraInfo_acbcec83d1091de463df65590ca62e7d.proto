syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "harpia_generated/protofiles/CameraFacing_acbcec83d1091de463df65590ca62e7d.proto";
import "harpia_generated/protofiles/FrameSize_acbcec83d1091de463df65590ca62e7d.proto";
import "harpia_generated/protofiles/FpsRange_acbcec83d1091de463df65590ca62e7d.proto";
import "harpia_generated/protofiles/ControlCapability_acbcec83d1091de463df65590ca62e7d.proto";
message CameraInfo {
int32 ID_acbcec83d1091de463df65590ca62e7d = 1;
string camera_id = 2;
CameraFacing facing = 3;
string hardware_level = 4;
int32 sensor_orientation_deg = 5;
repeated float focal_lengths_mm = 6;
repeated FrameSize sizes = 7;
repeated FpsRange fps_ranges = 8;
repeated ControlCapability controls = 9;
string STATUS_acbcec83d1091de463df65590ca62e7d = 10;
string ERROR_acbcec83d1091de463df65590ca62e7d = 11;
string ORIGINATOR = 12;
}

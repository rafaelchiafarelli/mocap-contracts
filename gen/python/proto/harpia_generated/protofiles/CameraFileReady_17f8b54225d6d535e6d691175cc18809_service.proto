syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/CameraFileReady_17f8b54225d6d535e6d691175cc18809.proto";

message CameraFileReady_Message {
    CameraFileReady msg = 1;
}
//message for the standard functions 
message CameraFileReady_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CameraFileReady_ID {
    int32 id = 1;
}
message CameraFileReady_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CameraFileReady_Service {
    rpc heartBeat(CameraFileReady_HeartBeat) returns (CameraFileReady_HeartBeat) {}
    rpc streamSrc(CameraFileReady_Stream ) returns (stream CameraFileReady_Message) {}
    rpc pullByID(CameraFileReady_ID) returns (CameraFileReady_Message) {}
    rpc push(CameraFileReady_Message) returns (errorCode) {}
}

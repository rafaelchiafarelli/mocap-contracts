syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/PdfFont_7656bad163803b596999eb3843b4995c.proto";

message PdfFont_Message {
    PdfFont msg = 1;
}
//message for the standard functions 
message PdfFont_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message PdfFont_ID {
    int32 id = 1;
}
message PdfFont_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service PdfFont_Service {
    rpc heartBeat(PdfFont_HeartBeat) returns (PdfFont_HeartBeat) {}
    rpc streamSrc(PdfFont_Stream ) returns (stream PdfFont_Message) {}
    rpc pullByID(PdfFont_ID) returns (PdfFont_Message) {}
    rpc push(PdfFont_Message) returns (errorCode) {}
}

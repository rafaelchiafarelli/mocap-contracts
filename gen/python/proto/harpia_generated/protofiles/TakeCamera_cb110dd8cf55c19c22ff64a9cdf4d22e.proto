syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "harpia_generated/protofiles/CameraConfig_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "harpia_generated/protofiles/ControlResult_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "harpia_generated/protofiles/CameraControls_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "harpia_generated/protofiles/PreprocessSpec_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message TakeCamera {
int32 HARPIA_ID = 1;
CameraConfig config = 2;
repeated ControlResult control_results = 3;
CameraControls applied_controls = 4;
PreprocessSpec applied_preprocess = 5;
string HARPIA_STATUS = 6;
string HARPIA_ERROR = 7;
string HARPIA_ORIGINATOR = 8;
}

syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "harpia_generated/protofiles/BodyLength_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message Actor {
int32 HARPIA_ID = 1;
string id = 2;
string name = 3;
float height_m = 4;
repeated BodyLength lengths = 5;
string HARPIA_STATUS = 6;
string HARPIA_ERROR = 7;
string HARPIA_ORIGINATOR = 8;
}

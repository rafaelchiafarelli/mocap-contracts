syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/ExtractIndex_61c8c10158ef4d464aeae2ffe73974e6.proto";

message ExtractIndex_Message {
    ExtractIndex msg = 1;
}
//message for the standard functions 
message ExtractIndex_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ExtractIndex_ID {
    int32 id = 1;
}
message ExtractIndex_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ExtractIndex_Service {
    rpc heartBeat(ExtractIndex_HeartBeat) returns (ExtractIndex_HeartBeat) {}
    rpc streamSrc(ExtractIndex_Stream ) returns (stream ExtractIndex_Message) {}
    rpc pullByID(ExtractIndex_ID) returns (ExtractIndex_Message) {}
    rpc push(ExtractIndex_Message) returns (errorCode) {}
}

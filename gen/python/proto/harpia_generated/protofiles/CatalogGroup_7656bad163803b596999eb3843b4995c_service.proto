syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/CatalogGroup_7656bad163803b596999eb3843b4995c.proto";

message CatalogGroup_Message {
    CatalogGroup msg = 1;
}
//message for the standard functions 
message CatalogGroup_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CatalogGroup_ID {
    int32 id = 1;
}
message CatalogGroup_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CatalogGroup_Service {
    rpc heartBeat(CatalogGroup_HeartBeat) returns (CatalogGroup_HeartBeat) {}
    rpc streamSrc(CatalogGroup_Stream ) returns (stream CatalogGroup_Message) {}
    rpc pullByID(CatalogGroup_ID) returns (CatalogGroup_Message) {}
    rpc push(CatalogGroup_Message) returns (errorCode) {}
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/BoneStability_9741ae31683aa8e5c6ffec2922711a8d.proto";

message BoneStability_Message {
    BoneStability msg = 1;
}
//message for the standard functions 
message BoneStability_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message BoneStability_ID {
    int32 id = 1;
}
message BoneStability_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service BoneStability_Service {
    rpc heartBeat(BoneStability_HeartBeat) returns (BoneStability_HeartBeat) {}
    rpc streamSrc(BoneStability_Stream ) returns (stream BoneStability_Message) {}
    rpc pullByID(BoneStability_ID) returns (BoneStability_Message) {}
    rpc push(BoneStability_Message) returns (errorCode) {}
}

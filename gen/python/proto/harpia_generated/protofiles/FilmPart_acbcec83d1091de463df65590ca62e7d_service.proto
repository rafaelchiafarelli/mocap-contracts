syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/FilmPart_acbcec83d1091de463df65590ca62e7d.proto";

message FilmPart_Message {
    FilmPart msg = 1;
}
//message for the standard functions 
message FilmPart_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message FilmPart_ID {
    int32 id = 1;
}
message FilmPart_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service FilmPart_Service {
    rpc heartBeat(FilmPart_HeartBeat) returns (FilmPart_HeartBeat) {}
    rpc streamSrc(FilmPart_Stream ) returns (stream FilmPart_Message) {}
    rpc pullByID(FilmPart_ID) returns (FilmPart_Message) {}
    rpc push(FilmPart_Message) returns (errorCode) {}
}

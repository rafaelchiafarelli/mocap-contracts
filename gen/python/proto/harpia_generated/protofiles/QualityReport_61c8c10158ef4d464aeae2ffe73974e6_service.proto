syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/QualityReport_61c8c10158ef4d464aeae2ffe73974e6.proto";

message QualityReport_Message {
    QualityReport msg = 1;
}
//message for the standard functions 
message QualityReport_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message QualityReport_ID {
    int32 id = 1;
}
message QualityReport_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service QualityReport_Service {
    rpc heartBeat(QualityReport_HeartBeat) returns (QualityReport_HeartBeat) {}
    rpc streamSrc(QualityReport_Stream ) returns (stream QualityReport_Message) {}
    rpc pullByID(QualityReport_ID) returns (QualityReport_Message) {}
    rpc push(QualityReport_Message) returns (errorCode) {}
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/CameraSource_af98f0786af1eb31da6209cc006a6a92.proto";

message CameraSource_Message {
    CameraSource msg = 1;
}
//message for the standard functions 
message CameraSource_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CameraSource_ID {
    int32 id = 1;
}
message CameraSource_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CameraSource_Service {
    rpc heartBeat(CameraSource_HeartBeat) returns (CameraSource_HeartBeat) {}
    rpc streamSrc(CameraSource_Stream ) returns (stream CameraSource_Message) {}
    rpc pullByID(CameraSource_ID) returns (CameraSource_Message) {}
    rpc push(CameraSource_Message) returns (errorCode) {}
}

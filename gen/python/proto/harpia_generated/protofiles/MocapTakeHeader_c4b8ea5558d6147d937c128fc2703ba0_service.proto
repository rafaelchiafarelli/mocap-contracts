syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/MocapTakeHeader_c4b8ea5558d6147d937c128fc2703ba0.proto";

message MocapTakeHeader_Message {
    MocapTakeHeader msg = 1;
}
//message for the standard functions 
message MocapTakeHeader_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message MocapTakeHeader_ID {
    int32 id = 1;
}
message MocapTakeHeader_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service MocapTakeHeader_Service {
    rpc heartBeat(MocapTakeHeader_HeartBeat) returns (MocapTakeHeader_HeartBeat) {}
    rpc streamSrc(MocapTakeHeader_Stream ) returns (stream MocapTakeHeader_Message) {}
    rpc pullByID(MocapTakeHeader_ID) returns (MocapTakeHeader_Message) {}
    rpc push(MocapTakeHeader_Message) returns (errorCode) {}
}

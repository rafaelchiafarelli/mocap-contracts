syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/CameraTakeReport_17f8b54225d6d535e6d691175cc18809.proto";

message CameraTakeReport_Message {
    CameraTakeReport msg = 1;
}
//message for the standard functions 
message CameraTakeReport_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CameraTakeReport_ID {
    int32 id = 1;
}
message CameraTakeReport_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CameraTakeReport_Service {
    rpc heartBeat(CameraTakeReport_HeartBeat) returns (CameraTakeReport_HeartBeat) {}
    rpc streamSrc(CameraTakeReport_Stream ) returns (stream CameraTakeReport_Message) {}
    rpc pullByID(CameraTakeReport_ID) returns (CameraTakeReport_Message) {}
    rpc push(CameraTakeReport_Message) returns (errorCode) {}
}

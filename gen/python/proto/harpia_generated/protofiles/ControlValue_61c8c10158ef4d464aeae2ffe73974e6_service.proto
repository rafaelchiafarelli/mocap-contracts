syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/ControlValue_61c8c10158ef4d464aeae2ffe73974e6.proto";

message ControlValue_Message {
    ControlValue msg = 1;
}
//message for the standard functions 
message ControlValue_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ControlValue_ID {
    int32 id = 1;
}
message ControlValue_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ControlValue_Service {
    rpc heartBeat(ControlValue_HeartBeat) returns (ControlValue_HeartBeat) {}
    rpc streamSrc(ControlValue_Stream ) returns (stream ControlValue_Message) {}
    rpc pullByID(ControlValue_ID) returns (ControlValue_Message) {}
    rpc push(ControlValue_Message) returns (errorCode) {}
}

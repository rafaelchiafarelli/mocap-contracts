syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "harpia_generated/protofiles/ChangeOp_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message Change {
int32 HARPIA_ID = 1;
string time = 2;
string by = 3;
string path = 4;
optional string record = 5;
ChangeOp op = 6;
optional string before = 7;
optional string after = 8;
string HARPIA_STATUS = 9;
string HARPIA_ERROR = 10;
string HARPIA_ORIGINATOR = 11;
}

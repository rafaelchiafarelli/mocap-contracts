syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message CalibrationBoard {
int32 HARPIA_ID = 1;
int32 squares_x = 2;
int32 squares_y = 3;
float square_length_mm = 4;
float marker_length_mm = 5;
string aruco_dictionary = 6;
float measured_square_length_mm = 7;
string HARPIA_STATUS = 8;
string HARPIA_ERROR = 9;
string HARPIA_ORIGINATOR = 10;
}

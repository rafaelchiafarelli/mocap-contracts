syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message ScriptStrings {
int32 HARPIA_ID = 1;
string more = 2;
string continued_page_end = 3;
string continued_page_start = 4;
string dialogue_continued = 5;
string HARPIA_STATUS = 6;
string HARPIA_ERROR = 7;
string HARPIA_ORIGINATOR = 8;
}

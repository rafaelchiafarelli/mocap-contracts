syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/TextAlign_186a1974c92f444f1bbc853569958a27.proto";

message TextAlign_Message {
    TextAlign msg = 1;
}
//message for the standard functions 
message TextAlign_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message TextAlign_ID {
    int32 id = 1;
}
message TextAlign_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service TextAlign_Service {
    rpc heartBeat(TextAlign_HeartBeat) returns (TextAlign_HeartBeat) {}
    rpc streamSrc(TextAlign_Stream ) returns (stream TextAlign_Message) {}
    rpc pullByID(TextAlign_ID) returns (TextAlign_Message) {}
    rpc push(TextAlign_Message) returns (errorCode) {}
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/Change_4aa5f0e181bebd69dfa7c7bccc59b3a9.proto";

message Change_Message {
    Change msg = 1;
}
//message for the standard functions 
message Change_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message Change_ID {
    int32 id = 1;
}
message Change_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service Change_Service {
    rpc heartBeat(Change_HeartBeat) returns (Change_HeartBeat) {}
    rpc streamSrc(Change_Stream ) returns (stream Change_Message) {}
    rpc pullByID(Change_ID) returns (Change_Message) {}
    rpc push(Change_Message) returns (errorCode) {}
}

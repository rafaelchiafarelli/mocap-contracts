syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/SceneCharacter_e51d6d03132b4baa0ced72cde01af9d0.proto";

message SceneCharacter_Message {
    SceneCharacter msg = 1;
}
//message for the standard functions 
message SceneCharacter_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message SceneCharacter_ID {
    int32 id = 1;
}
message SceneCharacter_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service SceneCharacter_Service {
    rpc heartBeat(SceneCharacter_HeartBeat) returns (SceneCharacter_HeartBeat) {}
    rpc streamSrc(SceneCharacter_Stream ) returns (stream SceneCharacter_Message) {}
    rpc pullByID(SceneCharacter_ID) returns (SceneCharacter_Message) {}
    rpc push(SceneCharacter_Message) returns (errorCode) {}
}

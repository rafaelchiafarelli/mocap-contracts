syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message PointSet {
int32 HARPIA_ID = 1;
string name = 2;
string role = 3;
string path = 4;
int64 frames = 5;
repeated string point_names = 6;
string HARPIA_STATUS = 7;
string HARPIA_ERROR = 8;
string HARPIA_ORIGINATOR = 9;
}

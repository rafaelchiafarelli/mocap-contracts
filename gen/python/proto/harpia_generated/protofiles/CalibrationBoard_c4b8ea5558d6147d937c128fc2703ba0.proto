syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message CalibrationBoard {
int32 ID_c4b8ea5558d6147d937c128fc2703ba0 = 1;
int32 squares_x = 2;
int32 squares_y = 3;
float square_length_mm = 4;
float marker_length_mm = 5;
string aruco_dictionary = 6;
float measured_square_length_mm = 7;
string STATUS_c4b8ea5558d6147d937c128fc2703ba0 = 8;
string ERROR_c4b8ea5558d6147d937c128fc2703ba0 = 9;
string ORIGINATOR = 10;
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/TakeCamera_61c8c10158ef4d464aeae2ffe73974e6.proto";

message TakeCamera_Message {
    TakeCamera msg = 1;
}
//message for the standard functions 
message TakeCamera_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message TakeCamera_ID {
    int32 id = 1;
}
message TakeCamera_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service TakeCamera_Service {
    rpc heartBeat(TakeCamera_HeartBeat) returns (TakeCamera_HeartBeat) {}
    rpc streamSrc(TakeCamera_Stream ) returns (stream TakeCamera_Message) {}
    rpc pullByID(TakeCamera_ID) returns (TakeCamera_Message) {}
    rpc push(TakeCamera_Message) returns (errorCode) {}
}

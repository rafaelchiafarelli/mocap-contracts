syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "harpia_generated/protofiles/LengthUnit_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "harpia_generated/protofiles/UpAxis_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message MocapTakeHeader {
int32 HARPIA_ID = 1;
string take_id = 2;
string session_id = 3;
string actor_id = 4;
string character_id = 5;
float fps = 6;
int64 frame_count = 7;
int64 t0_ns = 8;
LengthUnit length_unit = 9;
UpAxis up_axis = 10;
repeated string body_joints = 11;
repeated string left_hand_joints = 12;
repeated string right_hand_joints = 13;
repeated string face_blendshape_names = 14;
string HARPIA_STATUS = 15;
string HARPIA_ERROR = 16;
string HARPIA_ORIGINATOR = 17;
}

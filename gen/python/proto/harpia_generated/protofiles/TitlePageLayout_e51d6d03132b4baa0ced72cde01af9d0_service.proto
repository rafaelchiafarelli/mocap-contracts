syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/TitlePageLayout_e51d6d03132b4baa0ced72cde01af9d0.proto";

message TitlePageLayout_Message {
    TitlePageLayout msg = 1;
}
//message for the standard functions 
message TitlePageLayout_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message TitlePageLayout_ID {
    int32 id = 1;
}
message TitlePageLayout_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service TitlePageLayout_Service {
    rpc heartBeat(TitlePageLayout_HeartBeat) returns (TitlePageLayout_HeartBeat) {}
    rpc streamSrc(TitlePageLayout_Stream ) returns (stream TitlePageLayout_Message) {}
    rpc pullByID(TitlePageLayout_ID) returns (TitlePageLayout_Message) {}
    rpc push(TitlePageLayout_Message) returns (errorCode) {}
}

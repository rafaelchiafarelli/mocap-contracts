syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/Annotation_e51d6d03132b4baa0ced72cde01af9d0.proto";

message Annotation_Message {
    Annotation msg = 1;
}
//message for the standard functions 
message Annotation_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message Annotation_ID {
    int32 id = 1;
}
message Annotation_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service Annotation_Service {
    rpc heartBeat(Annotation_HeartBeat) returns (Annotation_HeartBeat) {}
    rpc streamSrc(Annotation_Stream ) returns (stream Annotation_Message) {}
    rpc pullByID(Annotation_ID) returns (Annotation_Message) {}
    rpc push(Annotation_Message) returns (errorCode) {}
}

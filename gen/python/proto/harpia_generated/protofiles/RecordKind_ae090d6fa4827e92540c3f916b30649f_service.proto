syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/RecordKind_ae090d6fa4827e92540c3f916b30649f.proto";

message RecordKind_Message {
    RecordKind msg = 1;
}
//message for the standard functions 
message RecordKind_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message RecordKind_ID {
    int32 id = 1;
}
message RecordKind_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service RecordKind_Service {
    rpc heartBeat(RecordKind_HeartBeat) returns (RecordKind_HeartBeat) {}
    rpc streamSrc(RecordKind_Stream ) returns (stream RecordKind_Message) {}
    rpc pullByID(RecordKind_ID) returns (RecordKind_Message) {}
    rpc push(RecordKind_Message) returns (errorCode) {}
}

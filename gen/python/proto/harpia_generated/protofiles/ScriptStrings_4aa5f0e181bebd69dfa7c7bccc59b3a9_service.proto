syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/ScriptStrings_4aa5f0e181bebd69dfa7c7bccc59b3a9.proto";

message ScriptStrings_Message {
    ScriptStrings msg = 1;
}
//message for the standard functions 
message ScriptStrings_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ScriptStrings_ID {
    int32 id = 1;
}
message ScriptStrings_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ScriptStrings_Service {
    rpc heartBeat(ScriptStrings_HeartBeat) returns (ScriptStrings_HeartBeat) {}
    rpc streamSrc(ScriptStrings_Stream ) returns (stream ScriptStrings_Message) {}
    rpc pullByID(ScriptStrings_ID) returns (ScriptStrings_Message) {}
    rpc push(ScriptStrings_Message) returns (errorCode) {}
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/ControlResult_c4b8ea5558d6147d937c128fc2703ba0.proto";

message ControlResult_Message {
    ControlResult msg = 1;
}
//message for the standard functions 
message ControlResult_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ControlResult_ID {
    int32 id = 1;
}
message ControlResult_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ControlResult_Service {
    rpc heartBeat(ControlResult_HeartBeat) returns (ControlResult_HeartBeat) {}
    rpc streamSrc(ControlResult_Stream ) returns (stream ControlResult_Message) {}
    rpc pullByID(ControlResult_ID) returns (ControlResult_Message) {}
    rpc push(ControlResult_Message) returns (errorCode) {}
}

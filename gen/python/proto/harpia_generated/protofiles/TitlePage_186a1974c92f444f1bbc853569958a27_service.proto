syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/TitlePage_186a1974c92f444f1bbc853569958a27.proto";

message TitlePage_Message {
    TitlePage msg = 1;
}
//message for the standard functions 
message TitlePage_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message TitlePage_ID {
    int32 id = 1;
}
message TitlePage_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service TitlePage_Service {
    rpc heartBeat(TitlePage_HeartBeat) returns (TitlePage_HeartBeat) {}
    rpc streamSrc(TitlePage_Stream ) returns (stream TitlePage_Message) {}
    rpc pullByID(TitlePage_ID) returns (TitlePage_Message) {}
    rpc push(TitlePage_Message) returns (errorCode) {}
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/ControlSetting_9741ae31683aa8e5c6ffec2922711a8d.proto";

message ControlSetting_Message {
    ControlSetting msg = 1;
}
//message for the standard functions 
message ControlSetting_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ControlSetting_ID {
    int32 id = 1;
}
message ControlSetting_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ControlSetting_Service {
    rpc heartBeat(ControlSetting_HeartBeat) returns (ControlSetting_HeartBeat) {}
    rpc streamSrc(ControlSetting_Stream ) returns (stream ControlSetting_Message) {}
    rpc pullByID(ControlSetting_ID) returns (ControlSetting_Message) {}
    rpc push(ControlSetting_Message) returns (errorCode) {}
}

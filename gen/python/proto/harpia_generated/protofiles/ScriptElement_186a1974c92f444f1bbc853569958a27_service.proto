syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/ScriptElement_186a1974c92f444f1bbc853569958a27.proto";

message ScriptElement_Message {
    ScriptElement msg = 1;
}
//message for the standard functions 
message ScriptElement_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ScriptElement_ID {
    int32 id = 1;
}
message ScriptElement_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ScriptElement_Service {
    rpc heartBeat(ScriptElement_HeartBeat) returns (ScriptElement_HeartBeat) {}
    rpc streamSrc(ScriptElement_Stream ) returns (stream ScriptElement_Message) {}
    rpc pullByID(ScriptElement_ID) returns (ScriptElement_Message) {}
    rpc push(ScriptElement_Message) returns (errorCode) {}
}

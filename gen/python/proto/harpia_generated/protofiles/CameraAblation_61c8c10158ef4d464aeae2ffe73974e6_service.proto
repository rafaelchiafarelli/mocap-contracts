syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/CameraAblation_61c8c10158ef4d464aeae2ffe73974e6.proto";

message CameraAblation_Message {
    CameraAblation msg = 1;
}
//message for the standard functions 
message CameraAblation_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CameraAblation_ID {
    int32 id = 1;
}
message CameraAblation_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CameraAblation_Service {
    rpc heartBeat(CameraAblation_HeartBeat) returns (CameraAblation_HeartBeat) {}
    rpc streamSrc(CameraAblation_Stream ) returns (stream CameraAblation_Message) {}
    rpc pullByID(CameraAblation_ID) returns (CameraAblation_Message) {}
    rpc push(CameraAblation_Message) returns (errorCode) {}
}

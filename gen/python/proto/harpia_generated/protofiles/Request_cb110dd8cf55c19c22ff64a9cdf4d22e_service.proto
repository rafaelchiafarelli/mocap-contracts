syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/Request_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";

message Request_Message {
    Request msg = 1;
}
//message for the standard functions 
message Request_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message Request_ID {
    int32 id = 1;
}
message Request_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service Request_Service {
    rpc heartBeat(Request_HeartBeat) returns (Request_HeartBeat) {}
    rpc streamSrc(Request_Stream ) returns (stream Request_Message) {}
    rpc pullByID(Request_ID) returns (Request_Message) {}
    rpc push(Request_Message) returns (errorCode) {}
}

syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "harpia_generated/protofiles/TextAlign_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "harpia_generated/protofiles/Flag_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "harpia_generated/protofiles/TitleFont_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message TitleString {
int32 HARPIA_ID = 1;
repeated string items = 2;
float x_mm = 3;
float y_mm = 4;
int32 size_pt = 5;
TextAlign align = 6;
Flag bold = 7;
Flag italic = 8;
Flag underlined = 9;
TitleFont font = 10;
string HARPIA_STATUS = 11;
string HARPIA_ERROR = 12;
string HARPIA_ORIGINATOR = 13;
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/AnnotationCatalog_186a1974c92f444f1bbc853569958a27.proto";

message AnnotationCatalog_Message {
    AnnotationCatalog msg = 1;
}
//message for the standard functions 
message AnnotationCatalog_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message AnnotationCatalog_ID {
    int32 id = 1;
}
message AnnotationCatalog_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service AnnotationCatalog_Service {
    rpc heartBeat(AnnotationCatalog_HeartBeat) returns (AnnotationCatalog_HeartBeat) {}
    rpc streamSrc(AnnotationCatalog_Stream ) returns (stream AnnotationCatalog_Message) {}
    rpc pullByID(AnnotationCatalog_ID) returns (AnnotationCatalog_Message) {}
    rpc push(AnnotationCatalog_Message) returns (errorCode) {}
}

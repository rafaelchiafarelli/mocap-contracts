syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/FileKind_61c8c10158ef4d464aeae2ffe73974e6.proto";

message FileKind_Message {
    FileKind msg = 1;
}
//message for the standard functions 
message FileKind_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message FileKind_ID {
    int32 id = 1;
}
message FileKind_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service FileKind_Service {
    rpc heartBeat(FileKind_HeartBeat) returns (FileKind_HeartBeat) {}
    rpc streamSrc(FileKind_Stream ) returns (stream FileKind_Message) {}
    rpc pullByID(FileKind_ID) returns (FileKind_Message) {}
    rpc push(FileKind_Message) returns (errorCode) {}
}

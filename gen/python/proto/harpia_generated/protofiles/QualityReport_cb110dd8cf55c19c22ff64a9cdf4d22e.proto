syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "harpia_generated/protofiles/CameraQuality_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "harpia_generated/protofiles/BoneStability_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "harpia_generated/protofiles/CameraAblation_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message QualityReport {
int32 HARPIA_ID = 1;
string take_id = 2;
optional float calibration_reproj_err_px = 3;
repeated CameraQuality cameras = 4;
repeated BoneStability bones = 5;
repeated CameraAblation ablation = 6;
string HARPIA_STATUS = 7;
string HARPIA_ERROR = 8;
string HARPIA_ORIGINATOR = 9;
}

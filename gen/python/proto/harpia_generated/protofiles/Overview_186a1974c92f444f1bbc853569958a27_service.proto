syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "harpia_generated/protofiles/errorCode.proto";
import "harpia_generated/protofiles/heartBeat.proto";

//user imports from harpia process
import "harpia_generated/protofiles/Overview_186a1974c92f444f1bbc853569958a27.proto";

message Overview_Message {
    Overview msg = 1;
}
//message for the standard functions 
message Overview_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message Overview_ID {
    int32 id = 1;
}
message Overview_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service Overview_Service {
    rpc heartBeat(Overview_HeartBeat) returns (Overview_HeartBeat) {}
    rpc streamSrc(Overview_Stream ) returns (stream Overview_Message) {}
    rpc pullByID(Overview_ID) returns (Overview_Message) {}
    rpc push(Overview_Message) returns (errorCode) {}
}

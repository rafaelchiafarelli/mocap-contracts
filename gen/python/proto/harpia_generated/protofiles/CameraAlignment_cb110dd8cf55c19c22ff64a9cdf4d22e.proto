syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message CameraAlignment {
int32 HARPIA_ID = 1;
string role = 2;
int64 offset_ns = 3;
float drift_ppm = 4;
int64 frames_in = 5;
int64 frames_out = 6;
string HARPIA_STATUS = 7;
string HARPIA_ERROR = 8;
string HARPIA_ORIGINATOR = 9;
}

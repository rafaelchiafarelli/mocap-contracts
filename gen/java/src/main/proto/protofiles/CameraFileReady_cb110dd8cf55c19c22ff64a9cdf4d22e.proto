syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "protofiles/FileKind_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message CameraFileReady {
int32 HARPIA_ID = 1;
string take_id = 2;
string role = 3;
FileKind kind = 4;
string path = 5;
int64 size_bytes = 6;
string sha256 = 7;
int64 frames = 8;
int64 first_ts_ns = 9;
int64 last_ts_ns = 10;
string HARPIA_STATUS = 11;
string HARPIA_ERROR = 12;
string HARPIA_ORIGINATOR = 13;
}

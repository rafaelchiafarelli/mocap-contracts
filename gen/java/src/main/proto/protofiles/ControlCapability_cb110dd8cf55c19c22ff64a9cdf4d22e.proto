syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "protofiles/ControlBackend_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/ControlValueType_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/ControlValue_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/ControlMenuOption_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/Flag_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message ControlCapability {
int32 HARPIA_ID = 1;
ControlBackend backend = 2;
string key = 3;
ControlValueType value_type = 4;
ControlValue min_value = 5;
ControlValue max_value = 6;
ControlValue step = 7;
repeated ControlMenuOption options = 8;
ControlValue default_value = 9;
ControlValue current_value = 10;
Flag read_only = 11;
string unit = 12;
string HARPIA_STATUS = 13;
string HARPIA_ERROR = 14;
string HARPIA_ORIGINATOR = 15;
}

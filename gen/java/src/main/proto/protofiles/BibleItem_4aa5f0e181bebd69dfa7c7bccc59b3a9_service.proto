syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/BibleItem_4aa5f0e181bebd69dfa7c7bccc59b3a9.proto";

message BibleItem_Message {
    BibleItem msg = 1;
}
//message for the standard functions 
message BibleItem_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message BibleItem_ID {
    int32 id = 1;
}
message BibleItem_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service BibleItem_Service {
    rpc heartBeat(BibleItem_HeartBeat) returns (BibleItem_HeartBeat) {}
    rpc streamSrc(BibleItem_Stream ) returns (stream BibleItem_Message) {}
    rpc pullByID(BibleItem_ID) returns (BibleItem_Message) {}
    rpc push(BibleItem_Message) returns (errorCode) {}
}

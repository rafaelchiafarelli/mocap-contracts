syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/CameraConfig_c4b8ea5558d6147d937c128fc2703ba0.proto";

message CameraConfig_Message {
    CameraConfig msg = 1;
}
//message for the standard functions 
message CameraConfig_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CameraConfig_ID {
    int32 id = 1;
}
message CameraConfig_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CameraConfig_Service {
    rpc heartBeat(CameraConfig_HeartBeat) returns (CameraConfig_HeartBeat) {}
    rpc streamSrc(CameraConfig_Stream ) returns (stream CameraConfig_Message) {}
    rpc pullByID(CameraConfig_ID) returns (CameraConfig_Message) {}
    rpc push(CameraConfig_Message) returns (errorCode) {}
}

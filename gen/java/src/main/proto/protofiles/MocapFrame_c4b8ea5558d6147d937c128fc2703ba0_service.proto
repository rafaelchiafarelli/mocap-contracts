syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/MocapFrame_c4b8ea5558d6147d937c128fc2703ba0.proto";

message MocapFrame_Message {
    MocapFrame msg = 1;
}
//message for the standard functions 
message MocapFrame_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message MocapFrame_ID {
    int32 id = 1;
}
message MocapFrame_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service MocapFrame_Service {
    rpc heartBeat(MocapFrame_HeartBeat) returns (MocapFrame_HeartBeat) {}
    rpc streamSrc(MocapFrame_Stream ) returns (stream MocapFrame_Message) {}
    rpc pullByID(MocapFrame_ID) returns (MocapFrame_Message) {}
    rpc push(MocapFrame_Message) returns (errorCode) {}
}

syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message CameraStats {
int32 ID_e51d6d03132b4baa0ced72cde01af9d0 = 1;
string serial = 2;
int64 sensor_ns = 3;
float camera_fps = 4;
float encoder_fps = 5;
int64 dropped_frames = 6;
float cpu_percent = 7;
float battery_temp_c = 8;
int32 thermal_status = 9;
string STATUS_e51d6d03132b4baa0ced72cde01af9d0 = 10;
string ERROR_e51d6d03132b4baa0ced72cde01af9d0 = 11;
string ORIGINATOR_e51d6d03132b4baa0ced72cde01af9d0 = 12;
}

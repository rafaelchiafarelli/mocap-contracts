syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/DeviceInfo_c4b8ea5558d6147d937c128fc2703ba0.proto";

message DeviceInfo_Message {
    DeviceInfo msg = 1;
}
//message for the standard functions 
message DeviceInfo_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message DeviceInfo_ID {
    int32 id = 1;
}
message DeviceInfo_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service DeviceInfo_Service {
    rpc heartBeat(DeviceInfo_HeartBeat) returns (DeviceInfo_HeartBeat) {}
    rpc streamSrc(DeviceInfo_Stream ) returns (stream DeviceInfo_Message) {}
    rpc pullByID(DeviceInfo_ID) returns (DeviceInfo_Message) {}
    rpc push(DeviceInfo_Message) returns (errorCode) {}
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/ControlRequest_c4b8ea5558d6147d937c128fc2703ba0.proto";

message ControlRequest_Message {
    ControlRequest msg = 1;
}
//message for the standard functions 
message ControlRequest_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ControlRequest_ID {
    int32 id = 1;
}
message ControlRequest_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ControlRequest_Service {
    rpc heartBeat(ControlRequest_HeartBeat) returns (ControlRequest_HeartBeat) {}
    rpc streamSrc(ControlRequest_Stream ) returns (stream ControlRequest_Message) {}
    rpc pullByID(ControlRequest_ID) returns (ControlRequest_Message) {}
    rpc push(ControlRequest_Message) returns (errorCode) {}
}

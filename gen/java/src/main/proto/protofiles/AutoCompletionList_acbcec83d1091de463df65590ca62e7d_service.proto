syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/AutoCompletionList_acbcec83d1091de463df65590ca62e7d.proto";

message AutoCompletionList_Message {
    AutoCompletionList msg = 1;
}
//message for the standard functions 
message AutoCompletionList_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message AutoCompletionList_ID {
    int32 id = 1;
}
message AutoCompletionList_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service AutoCompletionList_Service {
    rpc heartBeat(AutoCompletionList_HeartBeat) returns (AutoCompletionList_HeartBeat) {}
    rpc streamSrc(AutoCompletionList_Stream ) returns (stream AutoCompletionList_Message) {}
    rpc pullByID(AutoCompletionList_ID) returns (AutoCompletionList_Message) {}
    rpc push(AutoCompletionList_Message) returns (errorCode) {}
}

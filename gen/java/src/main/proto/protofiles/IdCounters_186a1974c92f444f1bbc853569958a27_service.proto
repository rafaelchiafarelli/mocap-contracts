syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/IdCounters_186a1974c92f444f1bbc853569958a27.proto";

message IdCounters_Message {
    IdCounters msg = 1;
}
//message for the standard functions 
message IdCounters_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message IdCounters_ID {
    int32 id = 1;
}
message IdCounters_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service IdCounters_Service {
    rpc heartBeat(IdCounters_HeartBeat) returns (IdCounters_HeartBeat) {}
    rpc streamSrc(IdCounters_Stream ) returns (stream IdCounters_Message) {}
    rpc pullByID(IdCounters_ID) returns (IdCounters_Message) {}
    rpc push(IdCounters_Message) returns (errorCode) {}
}

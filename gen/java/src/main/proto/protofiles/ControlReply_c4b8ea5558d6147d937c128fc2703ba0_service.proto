syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/ControlReply_c4b8ea5558d6147d937c128fc2703ba0.proto";

message ControlReply_Message {
    ControlReply msg = 1;
}
//message for the standard functions 
message ControlReply_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ControlReply_ID {
    int32 id = 1;
}
message ControlReply_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ControlReply_Service {
    rpc heartBeat(ControlReply_HeartBeat) returns (ControlReply_HeartBeat) {}
    rpc streamSrc(ControlReply_Stream ) returns (stream ControlReply_Message) {}
    rpc pullByID(ControlReply_ID) returns (ControlReply_Message) {}
    rpc push(ControlReply_Message) returns (errorCode) {}
}

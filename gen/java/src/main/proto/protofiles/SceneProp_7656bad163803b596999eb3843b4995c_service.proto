syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/SceneProp_7656bad163803b596999eb3843b4995c.proto";

message SceneProp_Message {
    SceneProp msg = 1;
}
//message for the standard functions 
message SceneProp_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message SceneProp_ID {
    int32 id = 1;
}
message SceneProp_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service SceneProp_Service {
    rpc heartBeat(SceneProp_HeartBeat) returns (SceneProp_HeartBeat) {}
    rpc streamSrc(SceneProp_Stream ) returns (stream SceneProp_Message) {}
    rpc pullByID(SceneProp_ID) returns (SceneProp_Message) {}
    rpc push(SceneProp_Message) returns (errorCode) {}
}

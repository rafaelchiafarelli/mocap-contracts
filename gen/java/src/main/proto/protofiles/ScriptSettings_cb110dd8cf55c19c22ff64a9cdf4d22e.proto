syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "protofiles/PageSettings_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/ElementStyle_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/PdfSettings_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/ScriptStrings_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/HeaderSettings_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/AutoCompletionList_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/LocationGroup_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/TitlePages_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message ScriptSettings {
int32 HARPIA_ID = 1;
PageSettings page = 2;
repeated ElementStyle elements = 3;
PdfSettings pdf = 4;
ScriptStrings strings = 5;
HeaderSettings headers = 6;
repeated AutoCompletionList auto_completion = 7;
repeated LocationGroup locations = 8;
repeated string spelling_words = 9;
TitlePages title_page = 10;
string HARPIA_STATUS = 11;
string HARPIA_ERROR = 12;
string HARPIA_ORIGINATOR = 13;
}

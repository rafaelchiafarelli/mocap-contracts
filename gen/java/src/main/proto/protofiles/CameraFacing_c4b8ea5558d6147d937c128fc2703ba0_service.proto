syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/CameraFacing_c4b8ea5558d6147d937c128fc2703ba0.proto";

message CameraFacing_Message {
    CameraFacing msg = 1;
}
//message for the standard functions 
message CameraFacing_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CameraFacing_ID {
    int32 id = 1;
}
message CameraFacing_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CameraFacing_Service {
    rpc heartBeat(CameraFacing_HeartBeat) returns (CameraFacing_HeartBeat) {}
    rpc streamSrc(CameraFacing_Stream ) returns (stream CameraFacing_Message) {}
    rpc pullByID(CameraFacing_ID) returns (CameraFacing_Message) {}
    rpc push(CameraFacing_Message) returns (errorCode) {}
}

syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "protofiles/TakeType_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/SyncEvent_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/Casting_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/CalibrationBoard_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/TakeCamera_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message Take {
int32 HARPIA_ID = 1;
string id = 2;
string session_id = 3;
TakeType type = 4;
SyncEvent start = 5;
SyncEvent end = 6;
repeated Casting casting = 7;
CalibrationBoard board = 8;
repeated TakeCamera cameras = 9;
string HARPIA_STATUS = 10;
string HARPIA_ERROR = 11;
string HARPIA_ORIGINATOR = 12;
}

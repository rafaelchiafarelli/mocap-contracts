syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/PreprocessSpec_ae090d6fa4827e92540c3f916b30649f.proto";

message PreprocessSpec_Message {
    PreprocessSpec msg = 1;
}
//message for the standard functions 
message PreprocessSpec_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message PreprocessSpec_ID {
    int32 id = 1;
}
message PreprocessSpec_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service PreprocessSpec_Service {
    rpc heartBeat(PreprocessSpec_HeartBeat) returns (PreprocessSpec_HeartBeat) {}
    rpc streamSrc(PreprocessSpec_Stream ) returns (stream PreprocessSpec_Message) {}
    rpc pullByID(PreprocessSpec_ID) returns (PreprocessSpec_Message) {}
    rpc push(PreprocessSpec_Message) returns (errorCode) {}
}

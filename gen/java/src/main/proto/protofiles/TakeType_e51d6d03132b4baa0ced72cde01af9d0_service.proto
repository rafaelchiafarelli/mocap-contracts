syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/TakeType_e51d6d03132b4baa0ced72cde01af9d0.proto";

message TakeType_Message {
    TakeType msg = 1;
}
//message for the standard functions 
message TakeType_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message TakeType_ID {
    int32 id = 1;
}
message TakeType_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service TakeType_Service {
    rpc heartBeat(TakeType_HeartBeat) returns (TakeType_HeartBeat) {}
    rpc streamSrc(TakeType_Stream ) returns (stream TakeType_Message) {}
    rpc pullByID(TakeType_ID) returns (TakeType_Message) {}
    rpc push(TakeType_Message) returns (errorCode) {}
}

syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message PointSet {
int32 ID_c4b8ea5558d6147d937c128fc2703ba0 = 1;
string name = 2;
string role = 3;
string path = 4;
int64 frames = 5;
repeated string point_names = 6;
string STATUS_c4b8ea5558d6147d937c128fc2703ba0 = 7;
string ERROR_c4b8ea5558d6147d937c128fc2703ba0 = 8;
string ORIGINATOR = 9;
}

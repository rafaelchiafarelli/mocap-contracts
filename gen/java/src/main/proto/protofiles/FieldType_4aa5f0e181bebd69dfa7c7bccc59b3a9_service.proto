syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/FieldType_4aa5f0e181bebd69dfa7c7bccc59b3a9.proto";

message FieldType_Message {
    FieldType msg = 1;
}
//message for the standard functions 
message FieldType_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message FieldType_ID {
    int32 id = 1;
}
message FieldType_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service FieldType_Service {
    rpc heartBeat(FieldType_HeartBeat) returns (FieldType_HeartBeat) {}
    rpc streamSrc(FieldType_Stream ) returns (stream FieldType_Message) {}
    rpc pullByID(FieldType_ID) returns (FieldType_Message) {}
    rpc push(FieldType_Message) returns (errorCode) {}
}

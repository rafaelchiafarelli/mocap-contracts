syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message PointSet {
int32 ID_cb110dd8cf55c19c22ff64a9cdf4d22e = 1;
string name = 2;
string role = 3;
string path = 4;
int64 frames = 5;
repeated string point_names = 6;
string STATUS_cb110dd8cf55c19c22ff64a9cdf4d22e = 7;
string ERROR_cb110dd8cf55c19c22ff64a9cdf4d22e = 8;
string ORIGINATOR = 9;
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/AnnotationAnchor_e51d6d03132b4baa0ced72cde01af9d0.proto";

message AnnotationAnchor_Message {
    AnnotationAnchor msg = 1;
}
//message for the standard functions 
message AnnotationAnchor_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message AnnotationAnchor_ID {
    int32 id = 1;
}
message AnnotationAnchor_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service AnnotationAnchor_Service {
    rpc heartBeat(AnnotationAnchor_HeartBeat) returns (AnnotationAnchor_HeartBeat) {}
    rpc streamSrc(AnnotationAnchor_Stream ) returns (stream AnnotationAnchor_Message) {}
    rpc pullByID(AnnotationAnchor_ID) returns (AnnotationAnchor_Message) {}
    rpc push(AnnotationAnchor_Message) returns (errorCode) {}
}

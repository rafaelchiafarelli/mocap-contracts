syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message CameraQuality {
int32 HARPIA_ID = 1;
string role = 2;
float detection_rate_body = 3;
float detection_rate_left_hand = 4;
float detection_rate_right_hand = 5;
optional float jitter_px = 6;
optional float reproj_err_px = 7;
string HARPIA_STATUS = 8;
string HARPIA_ERROR = 9;
string HARPIA_ORIGINATOR = 10;
}

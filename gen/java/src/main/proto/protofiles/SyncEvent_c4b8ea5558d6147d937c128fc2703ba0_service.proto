syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/SyncEvent_c4b8ea5558d6147d937c128fc2703ba0.proto";

message SyncEvent_Message {
    SyncEvent msg = 1;
}
//message for the standard functions 
message SyncEvent_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message SyncEvent_ID {
    int32 id = 1;
}
message SyncEvent_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service SyncEvent_Service {
    rpc heartBeat(SyncEvent_HeartBeat) returns (SyncEvent_HeartBeat) {}
    rpc streamSrc(SyncEvent_Stream ) returns (stream SyncEvent_Message) {}
    rpc pullByID(SyncEvent_ID) returns (SyncEvent_Message) {}
    rpc push(SyncEvent_Message) returns (errorCode) {}
}

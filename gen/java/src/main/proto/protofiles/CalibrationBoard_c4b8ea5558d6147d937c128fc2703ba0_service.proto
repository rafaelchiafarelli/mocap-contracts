syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/CalibrationBoard_c4b8ea5558d6147d937c128fc2703ba0.proto";

message CalibrationBoard_Message {
    CalibrationBoard msg = 1;
}
//message for the standard functions 
message CalibrationBoard_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CalibrationBoard_ID {
    int32 id = 1;
}
message CalibrationBoard_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CalibrationBoard_Service {
    rpc heartBeat(CalibrationBoard_HeartBeat) returns (CalibrationBoard_HeartBeat) {}
    rpc streamSrc(CalibrationBoard_Stream ) returns (stream CalibrationBoard_Message) {}
    rpc pullByID(CalibrationBoard_ID) returns (CalibrationBoard_Message) {}
    rpc push(CalibrationBoard_Message) returns (errorCode) {}
}

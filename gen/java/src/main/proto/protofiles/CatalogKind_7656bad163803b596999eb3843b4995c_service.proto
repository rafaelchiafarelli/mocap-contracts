syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/CatalogKind_7656bad163803b596999eb3843b4995c.proto";

message CatalogKind_Message {
    CatalogKind msg = 1;
}
//message for the standard functions 
message CatalogKind_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message CatalogKind_ID {
    int32 id = 1;
}
message CatalogKind_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service CatalogKind_Service {
    rpc heartBeat(CatalogKind_HeartBeat) returns (CatalogKind_HeartBeat) {}
    rpc streamSrc(CatalogKind_Stream ) returns (stream CatalogKind_Message) {}
    rpc pullByID(CatalogKind_ID) returns (CatalogKind_Message) {}
    rpc push(CatalogKind_Message) returns (errorCode) {}
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/PointSet_c4b8ea5558d6147d937c128fc2703ba0.proto";

message PointSet_Message {
    PointSet msg = 1;
}
//message for the standard functions 
message PointSet_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message PointSet_ID {
    int32 id = 1;
}
message PointSet_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service PointSet_Service {
    rpc heartBeat(PointSet_HeartBeat) returns (PointSet_HeartBeat) {}
    rpc streamSrc(PointSet_Stream ) returns (stream PointSet_Message) {}
    rpc pullByID(PointSet_ID) returns (PointSet_Message) {}
    rpc push(PointSet_Message) returns (errorCode) {}
}

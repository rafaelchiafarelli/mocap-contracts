syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/TitleFont_4aa5f0e181bebd69dfa7c7bccc59b3a9.proto";

message TitleFont_Message {
    TitleFont msg = 1;
}
//message for the standard functions 
message TitleFont_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message TitleFont_ID {
    int32 id = 1;
}
message TitleFont_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service TitleFont_Service {
    rpc heartBeat(TitleFont_HeartBeat) returns (TitleFont_HeartBeat) {}
    rpc streamSrc(TitleFont_Stream ) returns (stream TitleFont_Message) {}
    rpc pullByID(TitleFont_ID) returns (TitleFont_Message) {}
    rpc push(TitleFont_Message) returns (errorCode) {}
}

syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/ScriptSettings_acbcec83d1091de463df65590ca62e7d.proto";

message ScriptSettings_Message {
    ScriptSettings msg = 1;
}
//message for the standard functions 
message ScriptSettings_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ScriptSettings_ID {
    int32 id = 1;
}
message ScriptSettings_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ScriptSettings_Service {
    rpc heartBeat(ScriptSettings_HeartBeat) returns (ScriptSettings_HeartBeat) {}
    rpc streamSrc(ScriptSettings_Stream ) returns (stream ScriptSettings_Message) {}
    rpc pullByID(ScriptSettings_ID) returns (ScriptSettings_Message) {}
    rpc push(ScriptSettings_Message) returns (errorCode) {}
}

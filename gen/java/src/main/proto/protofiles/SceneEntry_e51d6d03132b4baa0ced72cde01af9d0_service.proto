syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/SceneEntry_e51d6d03132b4baa0ced72cde01af9d0.proto";

message SceneEntry_Message {
    SceneEntry msg = 1;
}
//message for the standard functions 
message SceneEntry_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message SceneEntry_ID {
    int32 id = 1;
}
message SceneEntry_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service SceneEntry_Service {
    rpc heartBeat(SceneEntry_HeartBeat) returns (SceneEntry_HeartBeat) {}
    rpc streamSrc(SceneEntry_Stream ) returns (stream SceneEntry_Message) {}
    rpc pullByID(SceneEntry_ID) returns (SceneEntry_Message) {}
    rpc push(SceneEntry_Message) returns (errorCode) {}
}

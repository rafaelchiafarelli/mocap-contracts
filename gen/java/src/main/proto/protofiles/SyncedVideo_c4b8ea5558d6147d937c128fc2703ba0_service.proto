syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/SyncedVideo_c4b8ea5558d6147d937c128fc2703ba0.proto";

message SyncedVideo_Message {
    SyncedVideo msg = 1;
}
//message for the standard functions 
message SyncedVideo_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message SyncedVideo_ID {
    int32 id = 1;
}
message SyncedVideo_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service SyncedVideo_Service {
    rpc heartBeat(SyncedVideo_HeartBeat) returns (SyncedVideo_HeartBeat) {}
    rpc streamSrc(SyncedVideo_Stream ) returns (stream SyncedVideo_Message) {}
    rpc pullByID(SyncedVideo_ID) returns (SyncedVideo_Message) {}
    rpc push(SyncedVideo_Message) returns (errorCode) {}
}

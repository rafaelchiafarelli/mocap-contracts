syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "protofiles/Flag_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/CatalogField_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message CatalogGroup {
int32 HARPIA_ID = 1;
string key = 2;
string label = 3;
Flag per_scene = 4;
string department = 5;
repeated CatalogField fields = 6;
string HARPIA_STATUS = 7;
string HARPIA_ERROR = 8;
string HARPIA_ORIGINATOR = 9;
}

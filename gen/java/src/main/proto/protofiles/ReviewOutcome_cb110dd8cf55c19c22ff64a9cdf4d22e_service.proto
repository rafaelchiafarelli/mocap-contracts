syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/ReviewOutcome_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";

message ReviewOutcome_Message {
    ReviewOutcome msg = 1;
}
//message for the standard functions 
message ReviewOutcome_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message ReviewOutcome_ID {
    int32 id = 1;
}
message ReviewOutcome_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service ReviewOutcome_Service {
    rpc heartBeat(ReviewOutcome_HeartBeat) returns (ReviewOutcome_HeartBeat) {}
    rpc streamSrc(ReviewOutcome_Stream ) returns (stream ReviewOutcome_Message) {}
    rpc pullByID(ReviewOutcome_ID) returns (ReviewOutcome_Message) {}
    rpc push(ReviewOutcome_Message) returns (errorCode) {}
}

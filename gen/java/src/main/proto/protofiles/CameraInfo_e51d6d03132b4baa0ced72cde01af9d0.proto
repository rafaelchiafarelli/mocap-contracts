syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "protofiles/CameraFacing_e51d6d03132b4baa0ced72cde01af9d0.proto";
import "protofiles/FrameSize_e51d6d03132b4baa0ced72cde01af9d0.proto";
import "protofiles/FpsRange_e51d6d03132b4baa0ced72cde01af9d0.proto";
import "protofiles/ControlCapability_e51d6d03132b4baa0ced72cde01af9d0.proto";
message CameraInfo {

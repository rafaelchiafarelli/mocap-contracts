syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/FpsRange_c4b8ea5558d6147d937c128fc2703ba0.proto";

message FpsRange_Message {
    FpsRange msg = 1;
}
//message for the standard functions 
message FpsRange_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message FpsRange_ID {
    int32 id = 1;
}
message FpsRange_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service FpsRange_Service {
    rpc heartBeat(FpsRange_HeartBeat) returns (FpsRange_HeartBeat) {}
    rpc streamSrc(FpsRange_Stream ) returns (stream FpsRange_Message) {}
    rpc pullByID(FpsRange_ID) returns (FpsRange_Message) {}
    rpc push(FpsRange_Message) returns (errorCode) {}
}

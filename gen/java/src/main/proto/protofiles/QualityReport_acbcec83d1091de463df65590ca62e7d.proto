syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "protofiles/CameraQuality_acbcec83d1091de463df65590ca62e7d.proto";
import "protofiles/BoneStability_acbcec83d1091de463df65590ca62e7d.proto";
import "protofiles/CameraAblation_acbcec83d1091de463df65590ca62e7d.proto";
message QualityReport {
int32 ID_acbcec83d1091de463df65590ca62e7d = 1;
string take_id = 2;
optional float calibration_reproj_err_px = 3;
repeated CameraQuality cameras = 4;
repeated BoneStability bones = 5;
repeated CameraAblation ablation = 6;
string STATUS_acbcec83d1091de463df65590ca62e7d = 7;
string ERROR_acbcec83d1091de463df65590ca62e7d = 8;
string ORIGINATOR = 9;
}

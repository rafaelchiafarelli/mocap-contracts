syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/TextStyle_186a1974c92f444f1bbc853569958a27.proto";

message TextStyle_Message {
    TextStyle msg = 1;
}
//message for the standard functions 
message TextStyle_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message TextStyle_ID {
    int32 id = 1;
}
message TextStyle_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service TextStyle_Service {
    rpc heartBeat(TextStyle_HeartBeat) returns (TextStyle_HeartBeat) {}
    rpc streamSrc(TextStyle_Stream ) returns (stream TextStyle_Message) {}
    rpc pullByID(TextStyle_ID) returns (TextStyle_Message) {}
    rpc push(TextStyle_Message) returns (errorCode) {}
}

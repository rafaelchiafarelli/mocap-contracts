syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

message AnnotationAnchor {
int32 HARPIA_ID = 1;
string scene = 2;
optional int32 element = 3;
optional string quote = 4;
optional int32 occurrence = 5;
string HARPIA_STATUS = 6;
string HARPIA_ERROR = 7;
string HARPIA_ORIGINATOR = 8;
}

syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "protofiles/StreamSettings_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/ControlSetting_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/Flag_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message ControlRequest {
int32 HARPIA_ID = 1;
string request_id = 2;
string serial = 3;
StreamSettings stream = 4;
repeated ControlSetting settings = 5;
Flag want_device_info = 6;
string reply_endpoint = 10;
string HARPIA_STATUS = 7;
string HARPIA_ERROR = 8;
string HARPIA_ORIGINATOR = 9;
}

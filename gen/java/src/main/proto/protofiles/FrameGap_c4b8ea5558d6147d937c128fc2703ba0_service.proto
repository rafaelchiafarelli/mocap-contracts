syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/FrameGap_c4b8ea5558d6147d937c128fc2703ba0.proto";

message FrameGap_Message {
    FrameGap msg = 1;
}
//message for the standard functions 
message FrameGap_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message FrameGap_ID {
    int32 id = 1;
}
message FrameGap_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service FrameGap_Service {
    rpc heartBeat(FrameGap_HeartBeat) returns (FrameGap_HeartBeat) {}
    rpc streamSrc(FrameGap_Stream ) returns (stream FrameGap_Message) {}
    rpc pullByID(FrameGap_ID) returns (FrameGap_Message) {}
    rpc push(FrameGap_Message) returns (errorCode) {}
}

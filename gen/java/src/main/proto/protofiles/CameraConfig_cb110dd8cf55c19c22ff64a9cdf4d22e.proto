syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "protofiles/CameraSource_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/PreprocessSpec_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/ControlSetting_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message CameraConfig {
int32 HARPIA_ID = 1;
string role = 2;
CameraSource source = 3;
int32 width = 4;
int32 height = 5;
float fps = 6;
string notes = 7;
PreprocessSpec preprocess = 8;
repeated ControlSetting controls = 9;
optional string device_hint = 10;
optional string stream_host = 11;
optional int32 video_port = 12;
optional int32 sync_port = 13;
optional int32 control_port = 14;
optional int32 stats_port = 15;
string HARPIA_STATUS = 16;
string HARPIA_ERROR = 17;
string HARPIA_ORIGINATOR = 18;
}

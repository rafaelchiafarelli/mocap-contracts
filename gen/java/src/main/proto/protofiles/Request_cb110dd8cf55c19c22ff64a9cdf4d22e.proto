syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "protofiles/RequestStatus_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message Request {
int32 HARPIA_ID = 1;
string id = 2;
string from = 3;
string to = 4;
repeated string items = 5;
repeated string scenes = 6;
string what = 7;
string source = 8;
string time = 9;
RequestStatus status = 10;
optional string answer = 11;
optional string answered_by = 12;
string HARPIA_STATUS = 13;
string HARPIA_ERROR = 14;
string HARPIA_ORIGINATOR = 15;
}

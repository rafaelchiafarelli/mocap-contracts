syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/BibleLink_acbcec83d1091de463df65590ca62e7d.proto";

message BibleLink_Message {
    BibleLink msg = 1;
}
//message for the standard functions 
message BibleLink_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message BibleLink_ID {
    int32 id = 1;
}
message BibleLink_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service BibleLink_Service {
    rpc heartBeat(BibleLink_HeartBeat) returns (BibleLink_HeartBeat) {}
    rpc streamSrc(BibleLink_Stream ) returns (stream BibleLink_Message) {}
    rpc pullByID(BibleLink_ID) returns (BibleLink_Message) {}
    rpc push(BibleLink_Message) returns (errorCode) {}
}

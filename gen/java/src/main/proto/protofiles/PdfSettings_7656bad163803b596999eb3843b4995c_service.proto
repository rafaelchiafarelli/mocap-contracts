syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/PdfSettings_7656bad163803b596999eb3843b4995c.proto";

message PdfSettings_Message {
    PdfSettings msg = 1;
}
//message for the standard functions 
message PdfSettings_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message PdfSettings_ID {
    int32 id = 1;
}
message PdfSettings_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service PdfSettings_Service {
    rpc heartBeat(PdfSettings_HeartBeat) returns (PdfSettings_HeartBeat) {}
    rpc streamSrc(PdfSettings_Stream ) returns (stream PdfSettings_Message) {}
    rpc pullByID(PdfSettings_ID) returns (PdfSettings_Message) {}
    rpc push(PdfSettings_Message) returns (errorCode) {}
}

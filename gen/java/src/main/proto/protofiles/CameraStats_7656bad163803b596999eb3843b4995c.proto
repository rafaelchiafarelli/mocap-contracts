int64 dropped_frames = 6;
float cpu_percent = 7;
float battery_temp_c = 8;
int32 thermal_status = 9;
string STATUS_7656bad163803b596999eb3843b4995c = 10;
string ERROR_7656bad163803b596999eb3843b4995c = 11;

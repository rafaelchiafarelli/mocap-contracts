syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/Proposal_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";

message Proposal_Message {
    Proposal msg = 1;
}
//message for the standard functions 
message Proposal_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message Proposal_ID {
    int32 id = 1;
}
message Proposal_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service Proposal_Service {
    rpc heartBeat(Proposal_HeartBeat) returns (Proposal_HeartBeat) {}
    rpc streamSrc(Proposal_Stream ) returns (stream Proposal_Message) {}
    rpc pullByID(Proposal_ID) returns (Proposal_Message) {}
    rpc push(Proposal_Message) returns (errorCode) {}
}

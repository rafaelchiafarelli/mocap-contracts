syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/Argument_186a1974c92f444f1bbc853569958a27.proto";

message Argument_Message {
    Argument msg = 1;
}
//message for the standard functions 
message Argument_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message Argument_ID {
    int32 id = 1;
}
message Argument_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service Argument_Service {
    rpc heartBeat(Argument_HeartBeat) returns (Argument_HeartBeat) {}
    rpc streamSrc(Argument_Stream ) returns (stream Argument_Message) {}
    rpc pullByID(Argument_ID) returns (Argument_Message) {}
    rpc push(Argument_Message) returns (errorCode) {}
}

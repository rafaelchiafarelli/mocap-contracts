syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/Character_c4b8ea5558d6147d937c128fc2703ba0.proto";

message Character_Message {
    Character msg = 1;
}
//message for the standard functions 
message Character_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message Character_ID {
    int32 id = 1;
}
message Character_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service Character_Service {
    rpc heartBeat(Character_HeartBeat) returns (Character_HeartBeat) {}
    rpc streamSrc(Character_Stream ) returns (stream Character_Message) {}
    rpc pullByID(Character_ID) returns (Character_Message) {}
    rpc push(Character_Message) returns (errorCode) {}
}

syntax = "proto3";
option java_multiple_files = true;
option java_package = "com.harpia.generated";

import "protofiles/SceneCharacter_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
import "protofiles/SceneProp_cb110dd8cf55c19c22ff64a9cdf4d22e.proto";
message SceneEntry {
int32 HARPIA_ID = 1;
string scene = 2;
int32 order = 3;
string int_ext = 4;
string location = 5;
string time_of_day = 6;
optional string set_id = 7;
repeated SceneCharacter characters = 8;
repeated SceneProp props = 9;
int32 first_page = 10;
int32 last_page = 11;
int32 first_line = 12;
int32 last_line = 13;
string text_hash = 14;
string HARPIA_STATUS = 15;
string HARPIA_ERROR = 16;
string HARPIA_ORIGINATOR = 17;
}

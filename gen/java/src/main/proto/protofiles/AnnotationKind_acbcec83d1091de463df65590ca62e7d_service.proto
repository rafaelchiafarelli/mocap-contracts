syntax = "proto3";
package frameworkProtos;
option java_multiple_files = true;
option java_package = "com.harpia.generated";
//standard protofile with error code and standard heartBeat messages
import "protofiles/errorCode.proto";
import "protofiles/heartBeat.proto";

//user imports from harpia process
import "protofiles/AnnotationKind_acbcec83d1091de463df65590ca62e7d.proto";

message AnnotationKind_Message {
    AnnotationKind msg = 1;
}
//message for the standard functions 
message AnnotationKind_HeartBeat {
    heartBeat hb = 1;
}

//message for the pullByID function
message AnnotationKind_ID {
    int32 id = 1;
}
message AnnotationKind_Stream {
    int32 id = 1;
    string name = 2;
    // pagination (spec: "pagination" field modifier): limit <= 0 means
    // unbounded (return everything, matching pre-pagination behavior).
    int32 offset = 3;
    int32 limit = 4;
}
service AnnotationKind_Service {
    rpc heartBeat(AnnotationKind_HeartBeat) returns (AnnotationKind_HeartBeat) {}
    rpc streamSrc(AnnotationKind_Stream ) returns (stream AnnotationKind_Message) {}
    rpc pullByID(AnnotationKind_ID) returns (AnnotationKind_Message) {}
    rpc push(AnnotationKind_Message) returns (errorCode) {}
}
